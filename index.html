<!DOCTYPE html>

        #loginScreen {

            border: 1px solid #14344a;
            border-radius: 20px;

            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transition: all 0.5s ease;
        }

        #loginScreen::before, #loginScreen::after {
            content: '';
            position: absolute;
            top: 15%;
            bottom: 15%;
            width: 2px;
            background: linear-gradient(to bottom, transparent, #00d2ff, transparent);
        }
        #loginScreen::before { left: -1px; }
        #loginScreen::after { right: -1px; }

            color: #e0f0ff;
            font-size: 20px;
            font-weight: 800;

            margin-bottom: 5px;

        .login-subtitle {

<script>
    /* ============================================================
       ⭐⭐⭐ KHU VỰC CẤU HÌNH - DEV HOANG KHOI ⭐⭐⭐
       ============================================================
       
       【CÁC LOẠI THỜI HẠN KEY】
       - 1H  : 1 giờ
       - 12H : 12 giờ
       - 24H : 24 giờ (1 ngày)
       - 7D  : 7 ngày
       - 1M  : 1 tháng (30 ngày)
       - VV  : Vĩnh viễn
       
       【1】THÊM KEY MỚI (trong code):
       Thêm 1 dòng vào DEFAULT_KEYS bên dưới.
       
       Ví dụ:
           "KEY-1H":   { type: "1H",  label: "1 Giờ" },
           "KEY-12H":  { type: "12H", label: "12 Giờ" },
           "KEY-24H":  { type: "24H", label: "24 Giờ" },
           "KEY-7D":   { type: "7D",  label: "7 Ngày" },
           "KEY-1M":   { type: "1M",  label: "1 Tháng" },
           "KEY-VV":   { type: "VV",  label: "Vĩnh Viễn" },
       
       【2】MÃ MÁY ADMIN:
       - Mở trang, copy "MÃ MÁY CỦA BẠN" ở màn hình Login.
       - Dán vào mảng ADMIN_DEVICE_IDS.
       ============================================================ */

    // ----- DANH SÁCH KEY MẶC ĐỊNH -----
    const DEFAULT_KEYS = {
        "12H-HKHOIDZ":  { type: "12H", label: "12 Giờ" },
        "VV-HKHOIDZ13": { type: "VV",  label: "Vĩnh Viễn" },

        // ----- THÊM KEY MỚI Ở DƯỚI ĐÂY -----
        // "KEYVIP-001":  { type: "VV",  label: "Vĩnh Viễn" },
        // "KEY-7D-001":  { type: "7D",  label: "7 Ngày" },
        // "KEY-1M-001":  { type: "1M",  label: "1 Tháng" },
    };

    // ----- DANH SÁCH MÃ MÁY ADMIN -----
    const ADMIN_DEVICE_IDS = [
        // "DAN-MA-MAY-CUA-BAN-VAO-DAY",
    ];

    /* ============================================================
       ==== TỪ ĐÂY TRỞ XUỐNG LÀ CODE HỆ THỐNG ====
       ============================================================ */

    const DEV_NAME = "HOANG KHOI";

    // Bảng quy đổi thời hạn (miligiây)
    const DURATION_MAP = {
        "1H":  1 * 60 * 60 * 1000,
        "12H": 12 * 60 * 60 * 1000,
        "24H": 24 * 60 * 60 * 1000,
        "7D":  7 * 24 * 60 * 60 * 1000,
        "1M":  30 * 24 * 60 * 60 * 1000,
        "VV":  null  // Vĩnh viễn
    };

    const LABEL_MAP = {
        "1H":  "1 Giờ",
        "12H": "12 Giờ",
        "24H": "24 Giờ",
        "7D":  "7 Ngày",
        "1M":  "1 Tháng",
        "VV":  "Vĩnh Viễn"
    };

    const CSS_CLASS_MAP = {
        "1H":  "h1",
        "12H": "h12",
        "24H": "h24",
        "7D":  "d7",
        "1M":  "m1",
        "VV":  "vv"
    };

    // ================== TẠO DEVICE ID ==================
    function generateDeviceId() {
        const ua = navigator.userAgent || "";
        const platform = navigator.platform || "";
        const screenInfo = `${screen.width}x${screen.height}x${screen.colorDepth}`;
        const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
        const language = navigator.language || "";
        const cores = navigator.hardwareConcurrency || 0;
        const memory = navigator.deviceMemory || 0;

        const raw = `${ua}|${platform}|${screenInfo}|${timezone}|${language}|${cores}|${memory}`;

        let hash = 0;
        for (let i = 0; i < raw.length; i++) {
            const char = raw.charCodeAt(i);
            hash = ((hash << 5) - hash) + char;
            hash = hash & hash;
        }
        const hashHex = Math.abs(hash).toString(16).padStart(8, '0').toUpperCase();

        let hash2 = 0;
        for (let i = raw.length - 1; i >= 0; i--) {
            const char = raw.charCodeAt(i);
            hash2 = ((hash2 << 5) - hash2) + char;
            hash2 = hash2 & hash2;
        }
        const hashHex2 = Math.abs(hash2).toString(16).padStart(8, '0').toUpperCase();

        return `${hashHex.substring(0, 4)}-${hashHex.substring(4, 8)}-${hashHex2.substring(0, 4)}-${hashHex2.substring(4, 8)}`;
    }

    function getDeviceId() {
        let devId = localStorage.getItem('hkhoidz_device_id');
        if (!devId) {
            devId = generateDeviceId();
            localStorage.setItem('hkhoidz_device_id', devId);
        }
        return devId;
    }

    const DEVICE_ID = getDeviceId();

    function isAdminDevice() {
        if (ADMIN_DEVICE_IDS.length === 0) return false;
        return ADMIN_DEVICE_IDS.includes(DEVICE_ID);
    }

    const IS_ADMIN_DEVICE = isAdminDevice();

    // ================== HIỂN THỊ DEVICE ID ==================
    const deviceIdDisplay = document.getElementById('deviceIdDisplay');
    const deviceIdMini = document.getElementById('deviceIdMini');

    if (IS_ADMIN_DEVICE) {
        deviceIdDisplay.textContent = DEVICE_ID + " 👑";
        deviceIdDisplay.classList.add('admin-device');
        deviceIdMini.textContent = DEVICE_ID + " 👑";
        deviceIdMini.classList.add('admin-device');
    } else {
        deviceIdDisplay.textContent = DEVICE_ID;
        deviceIdMini.textContent = DEVICE_ID;
    }

    function copyDeviceId(el) {
        const text = DEVICE_ID;
        const restore = () => {
            if (IS_ADMIN_DEVICE) {
                el.textContent = DEVICE_ID + " 👑";
            } else {
                el.textContent = DEVICE_ID;
            }
        };
        navigator.clipboard.writeText(text).then(() => {
            el.textContent = "✓ ĐÃ COPY!";
            playSound('success');
            setTimeout(restore, 1200);
        }).catch(() => {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            el.textContent = "✓ ĐÃ COPY!";
            playSound('success');
            setTimeout(restore, 1200);
        });
    }

    deviceIdDisplay.addEventListener('click', () => copyDeviceId(deviceIdDisplay));
    deviceIdMini.addEventListener('click', () => copyDeviceId(deviceIdMini));

    function formatDateTime(timestamp) {
        const d = new Date(timestamp);
        const day = d.getDate().toString().padStart(2, '0');
        const month = (d.getMonth() + 1).toString().padStart(2, '0');
        const hours = d.getHours().toString().padStart(2, '0');
        const minutes = d.getMinutes().toString().padStart(2, '0');
        return `${day}/${month} ${hours}:${minutes}`;
    }

    // ================== QUẢN LÝ KEY ==================
    function loadKeys() {
        try {
            const saved = localStorage.getItem('hkhoidz_keys');
            if (saved) {
                const parsed = JSON.parse(saved);
                return { ...DEFAULT_KEYS, ...parsed };
            }
        } catch(e) {}
        return { ...DEFAULT_KEYS };
    }

    function saveKeys(keys) {
        try {
            localStorage.setItem('hkhoidz_keys', JSON.stringify(keys));
        } catch(e) {}
    }

    let VALID_KEYS = loadKeys();

    // Đảm bảo key cũ có trường createdAt
    function ensureCreatedAt() {
        let changed = false;
        Object.keys(VALID_KEYS).forEach(k => {
            const info = VALID_KEYS[k];
            if (info.type !== "VV" && !info.createdAt) {
                info.createdAt = Date.now();
                changed = true;
            }
        });
        if (changed) saveKeys(VALID_KEYS);
    }
    ensureCreatedAt();

    // Kiểm tra key còn hạn không
    function isKeyValid(key) {
        const info = VALID_KEYS[key];
        if (!info) return false;
        if (info.type === "VV") return true;
        const duration = DURATION_MAP[info.type];
        if (duration === null || duration === undefined) return false;
        if (!info.createdAt) return false;
        return (Date.now() - info.createdAt) < duration;
    }

    // Lấy thời gian hết hạn của key
    function getKeyExpireTime(key) {
        const info = VALID_KEYS[key];
        if (!info) return null;
        if (info.type === "VV") return null;
        const duration = DURATION_MAP[info.type];
        if (duration === null || duration === undefined) return null;
        if (!info.createdAt) return null;
        return info.createdAt + duration;
    }
